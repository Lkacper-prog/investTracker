services:
  mysql:
    image: 'mysql:8.0'
    environment:
      - 'MYSQL_DATABASE=invest_track_db'
      - 'MYSQL_USER=db_user'
      - 'MYSQL_PASSWORD=db_password'
      - 'MYSQL_ROOT_PASSWORD=root_password'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: